name: CrimeStack verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install backend dependencies
        run: uv sync --frozen
        working-directory: apps/api
      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/web
      - name: Install test browser
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Prepare disposable CI configuration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import secrets
          values = {
              "ENVIRONMENT": "development",
              "POSTGRES_DB": "crimestack",
              "POSTGRES_USER": "crimestack",
              "POSTGRES_PASSWORD": secrets.token_hex(24),
              "DATABASE_URL": "sqlite:///./crimestack.db",
              "TOKEN_SECRET": secrets.token_hex(32),
              "SIGNING_SECRET": secrets.token_hex(32),
              "SIGNING_KEY_ID": "ci",
              "BOOTSTRAP_SECRET": secrets.token_hex(32),
              "SCHEDULER_ENABLED": "false",
              "LLM_API_KEY": "",
              "LLM_MODEL": "",
          }
          Path(".env").write_text("".join(f"{key}={value}\n" for key, value in values.items()))
          PY
          docker compose --env-file .env config --quiet
      - name: Run verification
        run: bash ./scripts/verify.sh
      - name: Start deployment
        id: compose
        run: |
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          docker compose --env-file .env up --build --wait
      - name: Check deployment health
        run: bash ./scripts/smoke.sh
      - name: Stop deployment
        if: always() && steps.compose.outputs.attempted == 'true'
        run: docker compose --env-file .env down --volumes --remove-orphans
