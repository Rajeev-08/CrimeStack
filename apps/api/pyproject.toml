[project]
name = "crimestack"
version = "0.2.0"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "pydantic-settings>=2.7,<3", "PyJWT>=2.10,<3", "argon2-cffi>=23,<26", "python-multipart>=0.0.20,<1", "psycopg[binary]>=3.2,<4", "scikit-learn>=1.5,<2", "scipy>=1.14,<2", "httpx>=0.28,<1"]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.pytest.ini_options]
pythonpath = ["src"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008"] # FastAPI dependency injection intentionally uses call defaults.
