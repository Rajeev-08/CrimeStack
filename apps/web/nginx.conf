server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 11m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), geolocation=()" always;
    location /api/ { proxy_pass http://api:8000; proxy_read_timeout 120s; }
    location = /health { proxy_pass http://api:8000; }
    location = /ready { proxy_pass http://api:8000; }
    location /assets/ { expires 7d; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
